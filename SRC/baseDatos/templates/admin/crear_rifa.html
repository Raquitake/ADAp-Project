{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Crear Nueva Rifa</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de la Rifa</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="premio" class="form-label">Premio</label>
            <input type="text" class="form-control" id="premio" name="premio" placeholder="Ej: Cesta de Navidad">
        </div>
        <div class="mb-3">
            <label for="informacion" class="form-label">Descripción / Información</label>
            <textarea class="form-control" id="informacion" name="informacion" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha del Sorteo</label>
            <input type="datetime-local" class="form-control" id="fecha" name="fecha" required>
        </div>
        <div class="mb-3">
            <label for="imagen" class="form-label">Imagen de la Rifa</label>
            <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Crear Rifa</button>
        <a href="{{ url_for('gestionar_rifas') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
