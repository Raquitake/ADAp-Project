{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h2>Editar Evento</h2>
    </div>

    <div class="dashboard-card">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre del Evento:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" value="{{ evento.nombre_evento }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="localizacion">Localización:</label>
                    <input type="text" id="localizacion" name="localizacion" class="form-control"
                        value="{{ evento.localizacion }}" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha y Hora:</label>
                    <input type="datetime-local" id="fecha" name="fecha" class="form-control"
                        value="{% if evento.fecha %}{{ evento.fecha.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
                </div>

                <div class="form-group">
                    <label for="informacion">Información:</label>
                    <textarea id="informacion" name="informacion" class="form-control"
                        rows="5">{{ evento.informacion }}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-yellow">Actualizar Evento</button>
                    <a href="{{ url_for('ver_evento', id=evento.id) }}" class="btn btn-outline-gray">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
