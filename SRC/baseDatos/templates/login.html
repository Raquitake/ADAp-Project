{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; text-align: center;">
    <h2>Iniciar sesión</h2>
    <p>Cada pequeño gesto cuenta.</p>
    
    <form method="POST" style="background: #a5d6a7; padding: 20px; border-radius: 10px;">
        <div class="form-group">
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-green">Iniciar sesión</button>
        <p>¿Todavía no tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a></p>
    </form>
</div>
{% endblock %}
