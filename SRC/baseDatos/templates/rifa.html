{% extends "base.html" %}

{% block content %}
<div class="event-card" style="margin-top: 20px;">
    <img src="{{ url_for('static', filename='img/cesta_solidaria.jpg') }}" alt="Rifa">

    <div class="event-details">
        <h2>{{ rifa.titulo }}</h2>

        <p><strong>Premio:</strong> {{ rifa.premio }}</p>
        <p><strong>Fecha del sorteo:</strong> {{ rifa.fecha_sorteo }}</p>
        <p><strong>Descripción:</strong> {{ rifa.descripcion }}</p>

        <div style="margin-top: 20px;">
            <a href="{{ url_for('participar_rifa', id=rifa.id) }}" class="btn btn-green">
                Participar en la rifa
            </a>
            <a href="{{ url_for('eventos') }}" class="btn btn-green" style="margin-left: 10px;">
                Volver a eventos
            </a>
        </div>
    </div>
</div>
{% endblock %}
