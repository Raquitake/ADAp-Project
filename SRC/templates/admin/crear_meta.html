{% extends "base.html" %}
{% block content %}
<div class="container mt-4 mb-5">
    <h2>Crear Nueva Meta de Recaudación</h2>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Título de la Campaña</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Objetivo Económico (€)</label>
                        <input type="number" name="objetivo" class="form-control" step="0.01" min="1" required>
                    </div>
                    <div class="col-md-6 mb-3 d-flex align-items-center">
                        <div class="form-check form-switch mt-4 ms-3">
                            <input class="form-check-input" type="checkbox" name="activa" checked>
                            <label class="form-check-label fw-bold">Campaña Activa</label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha Inicio (incluida)</label>
                        <input type="datetime-local" name="fecha_inicio" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha Fin (incluida)</label>
                        <input type="datetime-local" name="fecha_fin" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción / Historia</label>
                    <textarea name="descripcion" class="form-control" rows="5" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Imagen de Cabecera (Opcional)</label>
                    <input type="file" name="imagen" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-success px-4">Crear Meta</button>
                <a href="{{ url_for('gestionar_metas') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
