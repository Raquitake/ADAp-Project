{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Editar Rifa</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de la Rifa</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ rifa.nombre }}" required>
        </div>
        
        <div class="mb-3">
            <label for="premio" class="form-label">Premio</label>
            <input type="text" class="form-control" id="premio" name="premio" value="{{ rifa.premio }}">
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio del Boleto (€)</label>
            <input type="number" class="form-control" id="precio" name="precio" step="0.01" min="0" value="{{ rifa.precio }}" required>
        </div>

        <div class="mb-3">
            <label for="informacion" class="form-label">Descripción / Información</label>
            <textarea class="form-control" id="informacion" name="informacion"
                rows="3">{{ rifa.informacion }}</textarea>
        </div>
        
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha del Sorteo</label>
            <input type="datetime-local" class="form-control" id="fecha" name="fecha"
                value="{{ rifa.fecha_fin.strftime('%Y-%m-%dT%H:%M') if rifa.fecha_fin else '' }}">
        </div>

        {% if rifa.imagen %}
        <div class="mb-2">
            <p>Imagen actual:</p>
            <img src="{{ url_for('static', filename=rifa.imagen) }}" alt="Actual" style="max-height: 150px;">
        </div>
        {% endif %}

        <div class="mb-3">
            <label for="imagen" class="form-label">Cambiar Imagen (opcional)</label>
            <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
        </div>

        <button type="submit" class="btn btn-success">Guardar Cambios</button>
        <a href="{{ url_for('gestionar_rifas') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
