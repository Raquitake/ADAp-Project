{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h2>Editar Mi Perfil</h2>
    </div>

    <div class="dashboard-card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre de Usuario:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" 
                           value="{{ current_user.nombre_usuario }}" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control" 
                           value="{{ current_user.correo_electronico }}" required>
                </div>

                <div class="form-group">
                    <label for="dni">DNI / NIF:</label>
                    <input type="text" id="dni" name="dni" class="form-control" 
                        value="{{ current_user.dni_nif if current_user.dni_nif else '' }}" 
                        placeholder="12345678Z"
                        pattern="[XYZ0-9][0-9]{7}[A-Z]" 
                        title="Debe tener 8 números y una letra mayúscula (o empezar por X, Y, Z)">
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-green">Guardar Cambios</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-red" style="margin-left: 10px;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
