{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; text-align: center;">
    <h2>Registrarse</h2>
    
    <form method="POST" style="background: #a5d6a7; padding: 20px; border-radius: 10px;">
        <div class="form-group">
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Contraseña" required>
        </div>
        <div class="form-group">
            <input type="password" name="password_repeat" placeholder="Repetir Contraseña" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label><input type="checkbox" required> Acepto la Política de Privacidad</label>
        </div>
        <button type="submit" class="btn btn-green">Registrarse</button>
    </form>
</div>
{% endblock %}
